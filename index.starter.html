<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSquad Calculator</title>
    <!-- Link the css file here -->
     <link rel="stylesheet" href="/files.starter.css">
    
  </head>
  <h1 class="title">CODESQUAD CALCULATOR</h1>
  <body>
    <!-- Examine the screenshot for the end result. Note the clear button is twice the size of the other buttons -->
    <!-- There are several ways to accomplish this task. We will share hints for one of those ways -->
    <!-- It is OK if you cannot come up with the same exact design but try to be as close as possible -->

    <!-- Take a moment to examine the structure of the HTML below closely. -->
    <!-- What containers are holding what HTML elements? -->
    <!-- Which containers are flex box parents and which are the children? -->
    <!-- TIP: add a red border on elements with your CSS for a visual clue to the structure -->

    <main class="main-container">
      <section class="container">
        <section class="display">
          <span id="display-result">0</span>
        </section>
        <section class="keypads">
          <section class="left">

            <section class="left-top">
              <button type="button" id="clear">Clear</button>
              <button type="button">(-)</button>
            </section>

            <section class="left-middle">
              <section>
                <button type="button" value="1">1</button>
                <button type="button" value="2">2</button>
                <button type="button" value="3">3</button>
              </section>
              <section>
                <button type="button" value="4">4</button>
                <button type="button" value="5">5</button>
                <button type="button" value="6">6</button>
              </section>
              <section>
                <button type="button" value="7">7</button>
                <button type="button" value="8">8</button>
                <button type="button" value="9">9</button>
              </section>
            </section>

            <section class="left-bottom">
              <button type="button" value="0">0</button>
              <button type="button" value=".">.</button>
            </section>

          </section>
          <section class="right">
            <button type="button" value="/">/</button>
            <button type="button" value="x">x</button>
            <button type="button" value="-">-</button>
            <button type="button" value="+">+</button>
            <button type="button" value="=">=</button>
          </section>
        </section>
    </section>
    </main>
  </body>
</html>
